<svg width="40" height="40" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Green arrow shown when the frog cursor is switched off. Green fill + white
       outline (same ~1.45px as the pointer cursor), soft drop shadow. -->
  <defs>
    <filter id="lilyCursor" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="1" stdDeviation="0.8" flood-color="#08281d" flood-opacity="0.4"/>
    </filter>
  </defs>
  <path d="M6 3.2
           L6 23.4
           L11.3 18.4
           L14.6 25.6
           L17.9 24.1
           L14.6 17.0
           L21.4 16.7
           Z"
        fill="#005C46"
        stroke="#ffffff"
        stroke-width="2.6"
        stroke-linejoin="round"
        vector-effect="non-scaling-stroke"
        filter="url(#lilyCursor)"/>
</svg>
