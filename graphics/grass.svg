  <style>
    .blade { transform-box: fill-box; transform-origin: 50% 100%; }
    .blade-a { animation: sway 3.6s ease-in-out infinite; }
    .blade-b { animation: sway 4.4s ease-in-out infinite; animation-delay: -1.1s; }
    .blade-c { animation: sway 5.2s ease-in-out infinite; animation-delay: -2.3s; }
    @keyframes sway {
      0%,100% { transform: rotate(-3deg); }
      50%     { transform: rotate(3deg); }
    }
    @media (prefers-reduced-motion: reduce) { .blade { animation: none; } }
    @media (max-width: 600px) {
      .grass-back, .grass-mid, .grass-front { display: none; }
    }
